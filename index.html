<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1c14"><title>ختم قرآن کریم</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07130e;color:#f7f2e4;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px 14px 50px}.hero{text-align:center;padding:25px 0}.moon{font-size:42px;color:#e1c777}.hero h1{color:#ead594;margin:8px 0}.muted{color:#9fb0a6;font-size:13px}.panel{background:#10251b;border:1px solid #294638;border-radius:22px;padding:17px;margin:12px 0}.bar{height:10px;background:#20392d;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;width:0;background:linear-gradient(90deg,#60c98d,#dfbd70)}.stats,.grid{display:grid;gap:10px}.stats{grid-template-columns:repeat(3,1fr)}.stat{background:#0b1a13;border:1px solid #20392d;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:20px;color:#e5cf8a}.stat span{font-size:11px;color:#9fb0a6}.grid{grid-template-columns:repeat(2,1fr)}.juz{background:#11271d;border:1px solid #294638;border-radius:18px;padding:15px}.juz h3{margin:0;color:#ead594}.badge{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:20px;background:#173c2b;color:#79dba0;font-size:11px}.busy .badge{background:#4a341a;color:#f1c16e}.done .badge{background:#18374e;color:#8fc9f5}.juz button,.actions button{width:100%;border:0;border-radius:12px;padding:11px;margin-top:10px;font-weight:bold}.primary{background:#dfbd70;color:#162017}.secondary{background:#24382e;color:white}.people{display:grid;gap:8px}.person{background:#0b1a13;border:1px solid #20392d;border-radius:14px;padding:11px}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:flex-end;justify-content:center}.box{background:#10251b;width:min(600px,100%);padding:20px;border-radius:24px 24px 0 0}.box input{width:100%;padding:12px;border-radius:12px;border:1px solid #365443;background:#08150f;color:#fff;margin:8px 0}.reader{display:none;position:fixed;inset:0;background:#07130e;overflow:auto;z-index:10}.readerTop{position:sticky;top:0;background:#0b1c15ee;padding:12px;display:flex;justify-content:space-between}.readerTop button{background:#20382e;color:white;border:0;border-radius:10px;padding:9px}.readerBody{max-width:760px;margin:auto;padding:20px}.page{background:#f7f0dd;color:#272217;border-radius:17px;padding:25px 18px;min-height:65vh}.ayah{font:24px/2.25 "Times New Roman",serif;text-align:justify}.nav{display:flex;gap:8px;margin-top:10px}.nav button{flex:1;padding:13px;border:0;border-radius:12px;background:#dfbd70}.close{float:left;background:transparent!important;color:#fff!important}.section{margin-top:25px}.footer{text-align:center;color:#74847b;font-size:11px;margin-top:25px}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}.modal{align-items:center}.box{border-radius:24px}.readerBody{padding-top:30px}}
</style></head>
<body>
<div class="wrap">
<header class="hero"><div class="moon">☾</div><h1>ختم قرآن کریم</h1><div class="muted">با هم می‌خوانیم، با هم به پایان می‌رسانیم</div></header>
<section class="panel"><div style="display:flex;justify-content:space-between"><span>پیشرفت ختم</span><b id="pct">۰٪</b></div><div class="bar"><div id="fill" class="fill"></div></div><div id="progress" class="muted">۰ از ۳۰ جزء تکمیل شده</div><div class="stats"><div class="stat"><b id="free">۳۰</b><span>آزاد</span></div><div class="stat"><b id="reading">۰</b><span>در حال قرائت</span></div><div class="stat"><b id="done">۰</b><span>تکمیل شده</span></div></div></section>
<div class="section"><h2>📖 ۳۰ جزء قرآن</h2><div id="grid" class="grid"></div></div>
<div class="section"><h2>👥 همراهان ختم</h2><section class="panel"><div id="people" class="people"></div></section></div>
<div class="footer">نسخه آزمایشی · آماده اتصال به Supabase</div>
</div>

<div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">✕</button><h2>برداشتن جزء <span id="jnum"></span></h2><div class="muted">نام خودت را وارد کن.</div><input id="name" maxlength="40" placeholder="مثلاً علی رضایی"><div class="actions"><button class="primary" onclick="take()">شروع قرائت</button><button class="secondary" onclick="closeModal()">انصراف</button></div></div></div>

<div id="reader" class="reader"><div class="readerTop"><button onclick="closeReader()">‹ بازگشت</button><b id="rtitle">جزء</b><button onclick="closeReader()">✕</button></div><div class="readerBody"><div id="rloading" class="muted" style="text-align:center;padding:40px">در حال دریافت قرآن...</div><div id="page" class="page" style="display:none"><div id="pno" style="text-align:center;color:#806c45;font-size:11px;margin-bottom:18px"></div><div id="ayahs"></div></div><div class="nav"><button id="prev" onclick="change(-1)">‹ صفحه قبل</button><button id="next" onclick="change(1)">صفحه بعد ›</button></div><button id="finish" class="nav" style="display:none;width:100%;margin-top:8px" onclick="finish()">✅ این جزء را تمام کردم</button></div></div>

<script>
const key='quran_khatm_v1';let data=JSON.parse(localStorage.getItem(key)||'null')||Array.from({length:30},(_,i)=>({juz:i+1,status:'free',name:'',page:0,total:0}));let selected=0,pages=[],pi=0;
const fa=n=>String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);const $=x=>document.getElementById(x);
function save(){localStorage.setItem(key,JSON.stringify(data))}
function render(){let free=data.filter(x=>x.status==='free').length,reading=data.filter(x=>x.status==='reading').length,done=data.filter(x=>x.status==='done').length,p=done/30*100;$('free').textContent=fa(free);$('reading').textContent=fa(reading);$('done').textContent=fa(done);$('pct').textContent=fa(Math.round(p))+'٪';$('fill').style.width=p+'%';$('progress').textContent=fa(done)+' از ۳۰ جزء تکمیل شده';
$('grid').innerHTML=data.map(x=>{let pct=x.total?Math.round(x.page/x.total*100):0;let s=x.status==='free'?'🟢 آزاد':x.status==='reading'?'🟠 در حال قرائت':'🔵 تکمیل شده';return `<article class="juz ${x.status}"><h3>جزء ${fa(x.juz)}</h3><span class="badge">${s}</span><p>${x.name?'👤 '+esc(x.name):'هنوز کسی برنداشته'}</p><div class="muted">${x.status==='reading'?'صفحه '+fa(x.page+1)+' از '+fa(x.total||'—'):x.status==='done'?'قرائت کامل شد':'آماده انتخاب'}</div><div class="bar"><div class="fill" style="width:${pct}%"></div></div>${x.status==='free'?`<button class="primary" onclick="openTake(${x.juz})">برداشتن جزء</button>`:`<button class="secondary" onclick="openReader(${x.juz})">📖 ${x.status==='done'?'مشاهده':'ادامه قرائت'}</button>`}</article>`}).join('');
let a=data.filter(x=>x.status!=='free');$('people').innerHTML=a.length?a.map(x=>`<div class="person">👤 <b>${esc(x.name)}</b><br><span class="muted">جزء ${fa(x.juz)} · ${x.status==='done'?'✅ تکمیل شده':'📖 در حال قرائت · صفحه '+fa(x.page+1)}</span></div>`).join(''):'<span class="muted">هنوز کسی جزءی را برنداشته.</span>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function openTake(j){selected=j;$('jnum').textContent=fa(j);$('name').value=localStorage.getItem('myName')||'';$('modal').style.display='flex'}
function closeModal(){$('modal').style.display='none'}
function take(){let n=$('name').value.trim();if(!n)return alert('نامت را وارد کن');let x=data.find(a=>a.juz===selected);if(x.status!=='free')return alert('این جزء قبلاً برداشته شده');localStorage.setItem('myName',n);x.status='reading';x.name=n;save();closeModal();render();openReader(selected)}
function openReader(j){let x=data.find(a=>a.juz===j);selected=j;pi=x.page||0;$('reader').style.display='block';$('rtitle').textContent='جزء '+fa(j);$('page').style.display='none';$('rloading').style.display='block';fetch('https://api.alquran.cloud/v1/juz/'+j+'/quran-uthmani').then(r=>r.json()).then(d=>{let m={};d.data.ayahs.forEach(a=>(m[a.page]??=[]).push(a));pages=Object.values(m);x.total=pages.length;save();render();draw()}).catch(()=>{$('rloading').textContent='اتصال اینترنت را بررسی کن.'})}
function draw(){$('rloading').style.display='none';$('page').style.display='block';$('pno').textContent='صفحه '+fa(pi+1)+' از '+fa(pages.length);$('ayahs').innerHTML=(pages[pi]||[]).map(a=>`<p class="ayah">${esc(a.text)} ﴿${fa(a.numberInSurah)}﴾</p>`).join('');$('prev').disabled=pi<=0;$('next').disabled=pi>=pages.length-1;$('finish').style.display=pi===pages.length-1?'block':'none';let x=data.find(a=>a.juz===selected);if(x&&x.status==='reading'){x.page=pi;save();render()}}
function change(d){pi=Math.max(0,Math.min(pages.length-1,pi+d));draw();scrollTo(0,0)}
function finish(){let x=data.find(a=>a.juz===selected);x.status='done';x.page=pages.length-1;x.total=pages.length;save();render();closeReader();alert('ماشاءالله 🌿 جزء با موفقیت تکمیل شد.')}
function closeReader(){$('reader').style.display='none'}
render();
</script></body></html>
