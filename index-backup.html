<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Night House</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050606;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#rotate{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#030404;
    color:#aaa;
    text-align:center;
}

#rotateBox{
    width:70px;
    height:45px;
    border:2px solid #999;
    border-radius:7px;
    transform:rotate(90deg);
    margin-bottom:25px;
}

#rotate h2{
    font-size:19px;
    font-weight:400;
}

#start{
    position:fixed;
    inset:0;
    z-index:9000;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 45%,
            #242525 0%,
            #0b0d0d 38%,
            #020303 100%
        );
    color:#ddd;
    text-align:center;
}

#start h1{
    font-size:43px;
    font-weight:300;
    letter-spacing:10px;
}

#start p{
    margin-top:12px;
    margin-bottom:35px;
    color:#777;
    font-size:13px;
    letter-spacing:3px;
}

#startBtn{
    width:190px;
    height:48px;
    background:#121515;
    border:1px solid #555;
    color:#ccc;
    border-radius:3px;
    letter-spacing:3px;
    font-size:14px;
}

#hud{
    position:fixed;
    inset:0;
    z-index:100;
    pointer-events:none;
}

#look{
    position:absolute;
    right:0;
    top:0;
    width:65%;
    height:100%;
    pointer-events:auto;
    touch-action:none;
}

#joystick{
    position:absolute;
    left:28px;
    bottom:28px;
    width:140px;
    height:140px;
    border:1px solid rgba(255,255,255,.20);
    border-radius:50%;
    background:rgba(10,12,12,.22);
    pointer-events:auto;
    touch-action:none;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:58px;
    height:58px;
    margin:-29px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.38);
    background:rgba(180,185,185,.16);
}

.control{
    position:absolute;
    width:62px;
    height:62px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.28);
    background:rgba(8,10,10,.30);
    pointer-events:auto;
    touch-action:none;
}

#flash{
    right:28px;
    bottom:28px;
}

#interact{
    right:105px;
    bottom:103px;
}

#run{
    right:28px;
    bottom:108px;
}

#flash:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:16px;
    height:25px;
    transform:translate(-50%,-50%);
    border:1px solid #bbb;
    border-radius:3px;
}

#interact:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:21px;
    height:21px;
    transform:translate(-50%,-50%);
    border:1px solid #bbb;
    border-radius:3px;
}

#run:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    border:1px solid #bbb;
    border-radius:50%;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:4px;
    height:4px;
    margin:-2px;
    border-radius:50%;
    background:rgba(255,255,255,.55);
}

#message{
    position:absolute;
    left:50%;
    bottom:15%;
    transform:translateX(-50%);
    color:#ddd;
    font-size:13px;
    letter-spacing:2px;
    opacity:0;
    transition:opacity .2s;
    text-shadow:0 2px 8px #000;
}

#vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        radial-gradient(
            ellipse at center,
            transparent 42%,
            rgba(0,0,0,.15) 65%,
            rgba(0,0,0,.55) 100%
        );
}

#danger{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(80,0,0,.15) 70%,
            rgba(80,0,0,.35) 100%
        );
}
</style>
</head>

<body>

<div id="rotate">
    <div id="rotateBox"></div>
    <h2>ROTATE YOUR DEVICE</h2>
</div>

<div id="start">
    <div>
        <h1>NIGHT HOUSE</h1>
        <p>SOMETHING IS MOVING INSIDE</p>
        <button id="startBtn">ENTER</button>
    </div>
</div>

<div id="hud">

    <div id="look"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <div id="flash" class="control"></div>
    <div id="interact" class="control"></div>
    <div id="run" class="control"></div>

    <div id="crosshair"></div>
    <div id="message"></div>
    <div id="vignette"></div>
    <div id="danger"></div>

</div>

<script type="module">

import * as THREE from "./node_modules/three/build/three.module.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x111416);

scene.fog =
    new THREE.FogExp2(
        0x111416,
        0.032
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        70,
        innerWidth / innerHeight,
        .04,
        80
    );

camera.position.set(
    0,
    1.68,
    7
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        powerPreference:"high-performance"
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.6
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure =
    1.08;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   TEXTURES
========================================================= */

function makeTexture(
    kind,
    color
){

    const c=
        document.createElement("canvas");

    c.width=256;
    c.height=256;

    const ctx=
        c.getContext("2d");

    ctx.fillStyle=color;
    ctx.fillRect(0,0,256,256);


    if(kind==="wood"){

        for(
            let y=0;
            y<256;
            y+=32
        ){

            ctx.fillStyle=
                "rgba(0,0,0,.20)";

            ctx.fillRect(
                0,y,256,3
            );

            for(
                let j=0;
                j<8;
                j++
            ){

                ctx.strokeStyle=
                    "rgba(0,0,0,.09)";

                ctx.beginPath();

                ctx.moveTo(
                    0,
                    y+Math.random()*30
                );

                ctx.lineTo(
                    256,
                    y+Math.random()*30
                );

                ctx.stroke();
            }
        }
    }


    if(kind==="wall"){

        for(
            let i=0;
            i<2500;
            i++
        ){

            const n=
                Math.random()*45;

            ctx.fillStyle=
                `rgba(${n},${n},${n},.12)`;

            ctx.fillRect(
                Math.random()*256,
                Math.random()*256,
                1+Math.random()*2,
                1+Math.random()*2
            );
        }
    }


    if(kind==="floor"){

        for(
            let y=0;
            y<256;
            y+=26
        ){

            ctx.fillStyle=
                "rgba(0,0,0,.22)";

            ctx.fillRect(
                0,y,256,2
            );
        }
    }


    const t=
        new THREE.CanvasTexture(c);

    t.wrapS=
        THREE.RepeatWrapping;

    t.wrapT=
        THREE.RepeatWrapping;

    t.colorSpace=
        THREE.SRGBColorSpace;

    return t;
}


const woodTexture=
    makeTexture(
        "wood",
        "#4b3024"
    );

const wallTexture=
    makeTexture(
        "wall",
        "#666763"
    );

const floorTexture=
    makeTexture(
        "floor",
        "#302a25"
    );


/* =========================================================
   MATERIALS
========================================================= */

const floorMaterial=
    new THREE.MeshStandardMaterial({
        map:floorTexture,
        roughness:1
    });

const wallMaterial=
    new THREE.MeshStandardMaterial({
        map:wallTexture,
        roughness:.96
    });

const woodMaterial=
    new THREE.MeshStandardMaterial({
        map:woodTexture,
        roughness:.9
    });

const darkWood=
    new THREE.MeshStandardMaterial({
        color:0x241612,
        roughness:1
    });

const fabric=
    new THREE.MeshStandardMaterial({
        color:0x66615d,
        roughness:1
    });

const metal=
    new THREE.MeshStandardMaterial({
        color:0x777773,
        metalness:.65,
        roughness:.35
    });


/* =========================================================
   FLOOR
========================================================= */

const floor=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            20,.2,20
        ),
        floorMaterial
    );

floor.position.y=-.1;
floor.receiveShadow=true;

scene.add(floor);


/* =========================================================
   CEILING
========================================================= */

const ceiling=
    new THREE.Mesh(
        new THREE.BoxGeometry(
            20,.2,20
        ),
        darkWood
    );

ceiling.position.y=4;

scene.add(ceiling);


/* =========================================================
   COLLIDERS
========================================================= */

const colliders=[];

function collider(
    x,z,w,d
){

    colliders.push({
        x,z,w,d
    });
}


/* =========================================================
   WALL
========================================================= */

function wall(
    x,z,w,d
){

    const m=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,4,d
            ),
            wallMaterial
        );

    m.position.set(
        x,
        2,
        z
    );

    m.castShadow=true;
    m.receiveShadow=true;

    scene.add(m);

    collider(
        x,z,w,d
    );
}


/* =========================================================
   OUTER HOUSE
========================================================= */

wall(-10,0,.35,20);
wall(10,0,.35,20);
wall(0,10,20,.35);


/*
   Front wall deliberately has
   a 2m entrance opening.
*/

wall(-5,-10,10,.35);
wall(5,-10,10,.35);


/* =========================================================
   MAIN INTERIOR WALLS
========================================================= */


/*
   Central corridor width = 4m.
*/


/* left side */

wall(
    -7,
    0,
    .30,
    20
);


/* right side */

wall(
    7,
    0,
    .30,
    20
);


/*
   Room dividers.
   Each has a real 1.6m opening.
*/


function wallWithOpening(
    x,
    z,
    length,
    depth,
    opening
){

    const side=
        (length-opening)/2;

    wall(
        x-(opening+side)/2,
        z,
        side,
        depth
    );

    wall(
        x+(opening+side)/2,
        z,
        side,
        depth
    );
}


/* horizontal room separators */

wallWithOpening(
    -3.5,
    -4.5,
    7,
    .30,
    1.6
);

wallWithOpening(
    3.5,
    -4.5,
    7,
    .30,
    1.6
);

wallWithOpening(
    -3.5,
    4.5,
    7,
    .30,
    1.6
);

wallWithOpening(
    3.5,
    4.5,
    7,
    .30,
    1.6
);


/* back divider */

wallWithOpening(
    0,
    7.3,
    6.8,
    .30,
    1.6
);


/* =========================================================
   DOOR SYSTEM
========================================================= */

const doors=[];


/*
   Door is mounted from one edge.
   This means rotation happens around
   a realistic hinge.
*/

function createDoor(
    x,
    z,
    rotation,
    locked=false
){

    const pivot=
        new THREE.Group();

    pivot.position.set(
        x,
        0,
        z
    );

    pivot.rotation.y=
        rotation;

    scene.add(pivot);


    const door=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.58,
                2.8,
                .12
            ),
            woodMaterial
        );

    /*
       Hinge at local x=0.
    */

    door.position.set(
        .79,
        1.4,
        0
    );

    door.castShadow=true;
    door.receiveShadow=true;

    pivot.add(door);


    const knob=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .075,
                12,
                12
            ),
            metal
        );

    knob.position.set(
        .38,
        1.35,
        -.09
    );

    pivot.add(knob);


    doors.push({
        pivot:pivot,
        locked:locked,
        open:false,
        angle:0,
        x:x,
        z:z,
        rotation:rotation
    });
}


/*
   IMPORTANT:
   These coordinates are the actual
   centers of the wall openings.
*/


createDoor(
    -3.5,
    -4.5,
    0,
    false
);

createDoor(
    3.5,
    -4.5,
    0,
    true
);

createDoor(
    -3.5,
    4.5,
    0,
    true
);

createDoor(
    3.5,
    4.5,
    0,
    true
);

createDoor(
    0,
    7.3,
    0,
    true
);


/* =========================================================
   OBJECT HELPERS
========================================================= */

function object(
    x,y,z,
    sx,sy,sz,
    material,
    collision=false
){

    const m=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                sx,sy,sz
            ),
            material
        );

    m.position.set(
        x,y,z
    );

    m.castShadow=true;
    m.receiveShadow=true;

    scene.add(m);

    if(collision){

        collider(
            x,z,sx,sz
        );
    }

    return m;
}


/* =========================================================
   BED
========================================================= */

function bed(
    x,z,
    rot=0
){

    const g=
        new THREE.Group();

    g.position.set(
        x,0,z
    );

    g.rotation.y=rot;

    scene.add(g);


    const frame=
        object(
            0,.32,0,
            2.1,.45,3,
            darkWood
        );

    g.add(frame);


    const mattress=
        object(
            0,.66,0,
            2,.35,2.82,
            fabric
        );

    g.add(mattress);


    const pillow=
        object(
            0,.88,-1,
            1.65,.20,.5,
            new THREE.MeshStandardMaterial({
                color:0x8b8880,
                roughness:1
            })
        );

    g.add(pillow);


    const head=
        object(
            0,1.25,-1.5,
            2.1,1.5,.14,
            darkWood
        );

    g.add(head);
}


/* =========================================================
   TABLE
========================================================= */

function table(
    x,z
){

    object(
        x,1.05,z,
        1.8,.16,.9,
        woodMaterial,
        true
    );

    for(
        const dx of [-.72,.72]
    ){

        for(
            const dz of [-.32,.32]
        ){

            object(
                x+dx,.52,z+dz,
                .12,1,.12,
                darkWood
            );
        }
    }
}


/* =========================================================
   CABINET
========================================================= */

function cabinet(
    x,z,
    rot=0
){

    const g=
        new THREE.Group();

    g.position.set(
        x,0,z
    );

    g.rotation.y=rot;

    scene.add(g);


    const body=
        object(
            0,1.35,0,
            1.3,2.7,.55,
            darkWood
        );

    g.add(body);


    for(
        const y of [.75,1.35,1.95]
    ){

        const handle=
            object(
                .36,
                y,
                -.31,
                .16,
                .035,
                .035,
                metal
            );

        g.add(handle);
    }
}


/* =========================================================
   BOOKCASE
========================================================= */

function bookcase(
    x,z
){

    object(
        x,1.55,z,
        1.8,3.1,.4,
        darkWood,
        true
    );

    for(
        const y of [.6,1.2,1.8,2.4]
    ){

        object(
            x,y,z-.23,
            1.65,.08,.15,
            woodMaterial
        );

        for(
            let i=0;
            i<5;
            i++
        ){

            const h=
                .20+
                Math.random()*.3;

            object(
                x-.62+i*.3,
                y+.1+h/2,
                z-.25,
                .15,h,.15,
                new THREE.MeshStandardMaterial({
                    color:
                        [
                            0x4b3c35,
                            0x374043,
                            0x574b43,
                            0x313638,
                            0x62574e
                        ][i],
                    roughness:1
                })
            );
        }
    }
}


/* =========================================================
   CHAIRS
========================================================= */

function chair(
    x,z,
    rot=0
){

    const g=
        new THREE.Group();

    g.position.set(
        x,0,z
    );

    g.rotation.y=rot;

    scene.add(g);


    g.add(
        object(
            0,.72,0,
            .7,.14,.7,
            woodMaterial
        )
    );


    for(
        const dx of [-.25,.25]
    ){

        for(
            const dz of [-.25,.25]
        ){

            g.add(
                object(
                    dx,.37,dz,
                    .1,.74,.1,
                    darkWood
                )
            );
        }
    }


    g.add(
        object(
            0,1.25,.28,
            .7,1,.12,
            woodMaterial
        )
    );
}


/* =========================================================
   CRATES
========================================================= */

function crate(
    x,z,
    size=.7
){

    object(
        x,size/2,z,
        size,size,size,
        woodMaterial,
        true
    );

    object(
        x,size/2,z-.36*size,
        size*.08,size*.78,size*.04,
        darkWood
    );

    object(
        x-.36*size,size/2,z,
        size*.04,size*.78,size*.08,
        darkWood
    );
}


/* =========================================================
   KITCHEN
========================================================= */

function kitchen(){

    object(
        5.4,.85,-7.8,
        3.2,.9,.7,
        darkWood,
        true
    );

    object(
        5.4,1.32,-7.8,
        3.1,.10,.68,
        woodMaterial
    );

    object(
        5.4,1.42,-7.8,
        .85,.05,.45,
        metal
    );


    for(
        let i=0;
        i<4;
        i++
    ){

        object(
            4.1+i*.8,
            .9,
            -7.35,
            .58,
            .05,
            .38,
            metal
        );
    }
}


/* =========================================================
   WALL PICTURES
========================================================= */

function picture(
    x,y,z,
    rotation=0
){

    const g=
        new THREE.Group();

    g.position.set(
        x,y,z
    );

    g.rotation.y=
        rotation;

    scene.add(g);


    g.add(
        object(
            0,0,0,
            1.15,1.4,.08,
            darkWood
        )
    );


    g.add(
        object(
            0,0,.05,
            .9,1.12,.025,
            new THREE.MeshStandardMaterial({
                color:0x47494a,
                roughness:1
            })
        )
    );
}


/* =========================================================
   WINDOW
========================================================= */

function windowUnit(
    x,z,
    rotation=0
){

    const g=
        new THREE.Group();

    g.position.set(
        x,0,z
    );

    g.rotation.y=
        rotation;

    scene.add(g);


    g.add(
        object(
            0,2.15,0,
            2.3,1.8,.08,
            new THREE.MeshStandardMaterial({
                color:0x30434b,
                transparent:true,
                opacity:.45,
                roughness:.1
            })
        )
    );


    g.add(
        object(
            0,2.15,.07,
            .07,1.8,.08,
            darkWood
        )
    );


    g.add(
        object(
            0,2.15,.07,
            2.3,.07,.08,
            darkWood
        )
    );


    const moon=
        new THREE.PointLight(
            0x8ba6b7,
            1.5,
            8
        );

    moon.position.set(
        0,2.1,1
    );

    g.add(moon);
}


/* =========================================================
   FURNITURE PLACEMENT
========================================================= */

bed(
    -5,
    -7.4,
    0
);

bed(
    5,
    7.1,
    Math.PI
);

table(
    -4.9,
    -2
);

table(
    4.9,
    2
);

chair(
    -3.8,
    -2,
    Math.PI/2
);

chair(
    3.8,
    2,
    -Math.PI/2
);

cabinet(
    -8.7,
    -7.4
);

cabinet(
    8.7,
    7.3,
    Math.PI
);

bookcase(
    -8.5,
    6.5
);

bookcase(
    8.5,
    -5.9
);

crate(
    -8.2,
    1.8
);

crate(
    -8.7,
    2.35,
    .5
);

crate(
    8.1,
    5.8
);

crate(
    8.6,
    6.3,
    .5
);

kitchen();


windowUnit(
    -9.8,
    -2,
    Math.PI/2
);

windowUnit(
    9.8,
    3.5,
    -Math.PI/2
);

picture(
    -9.8,
    2.4,
    4,
    Math.PI/2
);

picture(
    9.8,
    2.4,
    -4,
    -Math.PI/2
);


/* =========================================================
   LIGHTING
========================================================= */

const roomLights=[];


function ceilingLight(
    x,z,
    power=1
){

    const bulb=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .12,
                12,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xffd09a,
                emissive:0xff9a55,
                emissiveIntensity:1.2
            })
        );

    bulb.position.set(
        x,3.65,z
    );

    scene.add(bulb);


    const light=
        new THREE.PointLight(
            0xffbd82,
            power,
            8
        );

    light.position.set(
        x,3.35,z
    );

    light.castShadow=true;

    scene.add(light);

    roomLights.push({
        light,
        bulb,
        base:power,
        phase:Math.random()*10
    });
}

/* =========================================================
   DUST
========================================================= */

const count=500;

const positions=
    new Float32Array(
        count*3
    );

const drift=
    new Float32Array(
        count
    );


for(
    let i=0;
    i<count;
    i++
){

    positions[i*3]=
        (Math.random()-.5)*19;

    positions[i*3+1]=
        Math.random()*3.8;

    positions[i*3+2]=
        (Math.random()-.5)*19;

    drift[i]=
        .00015+
        Math.random()*.0006;
}


const particleGeometry=
    new THREE.BufferGeometry();

particleGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);


const particleMaterial=
    new THREE.PointsMaterial({
        color:0xc8cdca,
        size:.018,
        transparent:true,
        opacity:.22,
        depthWrite:false
    });


const dust=
    new THREE.Points(
        particleGeometry,
        particleMaterial
    );

scene.add(dust);


/* =========================================================
   PLAYER
========================================================= */

let yaw=0;
let pitch=0;

let running=false;
let started=false;

let flashlightOn=true;

const playerRadius=.30;


/* =========================================================
   COLLISION
========================================================= */

function hit(
    x,z,
    c
){

    const hw=
        c.w/2+
        playerRadius;

    const hd=
        c.d/2+
        playerRadius;

    return(
        x>c.x-hw &&
        x<c.x+hw &&
        z>c.z-hd &&
        z<c.z+hd
    );
}


function blocked(
    x,z
){

    for(
        const c of colliders
    ){

        if(hit(x,z,c))
            return true;
    }


    /*
       Closed doors only.
       Open doors disappear from collision.
    */

    for(
        const d of doors
    ){

        if(!d.open){

            const dx=
                x-d.x;

            const dz=
                z-d.z;

            if(
                Math.abs(dx)<.85 &&
                Math.abs(dz)<.35
            ){

                return true;
            }
        }
    }

    return false;
}


/* =========================================================
   MOVE
========================================================= */

function movePlayer(
    forward,
    strafe
){

    const speed=
        running
        ? .13
        : .072;


    const fx=
        -Math.sin(yaw);

    const fz=
        -Math.cos(yaw);

    const rx=
        Math.cos(yaw);

    const rz=
        -Math.sin(yaw);


    const dx=
        (
            fx*forward+
            rx*strafe
        )*speed;

    const dz=
        (
            fz*forward+
            rz*strafe
        )*speed;


    const nx=
        camera.position.x+dx;

    const nz=
        camera.position.z+dz;


    if(
        !blocked(
            nx,
            camera.position.z
        )
    ){

        camera.position.x=
            nx;
    }


    if(
        !blocked(
            camera.position.x,
            nz
        )
    ){

        camera.position.z=
            nz;
    }
}


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

let joyX=0;
let joyY=0;
let joyPointer=null;


function updateJoystick(e){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=
        e.clientX-cx;

    let dy=
        e.clientY-cy;

    const max=48;

    const length=
        Math.hypot(dx,dy);

    if(length>max){

        dx=
            dx/length*max;

        dy=
            dy/length*max;
    }

    joyX=dx/max;
    joyY=dy/max;

    stick.style.transform=
        `translate(${dx}px,${dy}px)`;
}


joystick.addEventListener(
    "pointerdown",
    e=>{

        joyPointer=e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        updateJoystick(e);
    }
);


joystick.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId===joyPointer
        ){

            updateJoystick(e);
        }
    }
);


function resetJoystick(){

    joyPointer=null;
    joyX=0;
    joyY=0;

    stick.style.transform=
        "translate(0,0)";
}


joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);


/* =========================================================
   LOOK
========================================================= */

const look=
    document.getElementById(
        "look"
    );

let lookPointer=null;

let lastX=0;
let lastY=0;


look.addEventListener(
    "pointerdown",
    e=>{

        lookPointer=e.pointerId;

        lastX=e.clientX;
        lastY=e.clientY;

        look.setPointerCapture(
            e.pointerId
        );
    }
);


look.addEventListener(
    "pointermove",
    e=>{

        if(
            e.pointerId!==lookPointer
        ){

            return;
        }

        const dx=
            e.clientX-lastX;

        const dy=
            e.clientY-lastY;

        lastX=e.clientX;
        lastY=e.clientY;


        yaw-=dx*.004;
        pitch-=dy*.0028;


        pitch=
            Math.max(
                -1.18,
                Math.min(
                    1.18,
                    pitch
                )
            );
    }
);


look.addEventListener(
    "pointerup",
    ()=>{
        lookPointer=null;
    }
);

/* =========================================================
   INTERACTION
========================================================= */

const message=
    document.getElementById(
        "message"
    );


function say(text){

    message.textContent=text;
    message.style.opacity="1";

    clearTimeout(
        say.timer
    );

    say.timer=
        setTimeout(
            ()=>{
                message.style.opacity="0";
            },
            1300
        );
}


function nearestDoor(){

    let nearest=null;
    let distance=999;

    for(
        const d of doors
    ){

        const dx=
            camera.position.x-d.x;

        const dz=
            camera.position.z-d.z;

        const dist=
            Math.hypot(dx,dz);

        if(
            dist<distance &&
            dist<2
        ){

            distance=dist;
            nearest=d;
        }
    }

    return nearest;
}


document
.getElementById("interact")
.addEventListener(
    "pointerdown",
    e=>{

        e.preventDefault();

        const d=
            nearestDoor();

        if(!d){

            say(
                "NOTHING HERE"
            );

            return;
        }


        if(d.locked){

            say(
                "LOCKED"
            );

            return;
        }


        d.open=
            !d.open;
    }
);

/* =========================================================
   RANDOM HORROR EVENTS
========================================================= */

const danger=
    document.getElementById(
        "danger"
    );


let eventCooldown=8;


/*
   A distant object that can move
   across the corridor.
*/

const shadowMaterial=
    new THREE.MeshBasicMaterial({
        color:0x020303,
        transparent:true,
        opacity:0
    });


const shadow=
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .32,
            1.5,
            4,
            8
        ),
        shadowMaterial
    );

shadow.position.set(
    0,
    1.25,
    -8.5
);

scene.add(shadow);


function horrorEvent(){

    const event=
        Math.floor(
            Math.random()*4
        );


    if(event===0){

        /*
           sudden light failure
        */

        const chosen=
            roomLights[
                Math.floor(
                    Math.random()*
                    roomLights.length
                )
            ];

        const old=
            chosen.light.intensity;

        chosen.light.intensity=0;

        setTimeout(
            ()=>{
                chosen.light.intensity=old;
            },
            500+
            Math.random()*700
        );
    }


    if(event===1){

        /*
           distant shadow
        */

        shadow.material.opacity=.82;

        shadow.position.x=
            (Math.random()-.5)*3;

        shadow.position.z=
            camera.position.z-10;

        setTimeout(
            ()=>{
                shadow.material.opacity=0;
            },
            550
        );
    }


    if(event===2){

        /*
           violent light pulse
        */

        for(
            const l of roomLights
        ){

            l.light.intensity*=.3;
        }


        setTimeout(
            ()=>{
                for(
                    const l of roomLights
                ){

                    l.light.intensity=
                        l.base;
                }
            },
            180
        );
    }


    if(event===3){

        /*
           subtle camera disturbance
        */

        const oldPitch=pitch;

        pitch+=
            .025+
            Math.random()*.025;

        setTimeout(
            ()=>{
                pitch=oldPitch;
            },
            180
        );
    }
}

/* =========================================================
   ANIMATION
========================================================= */

let time=0;


function animate(){

    requestAnimationFrame(
        animate
    );

    time+=.016;


    /* light breathing/flicker */

    for(
        const item of roomLights
    ){

        const wave=
            Math.sin(
                time*2.1+
                item.phase
            )*.035;

        item.light.intensity=
            item.base+
            wave;
    }


    /* dust movement */

    const pos=
        dust.geometry.attributes
        .position.array;

    for(
        let i=0;
        i<count;
        i++
    ){

        pos[i*3+1]+=
            drift[i];

        pos[i*3]+=
            Math.sin(
                time*.4+i
            )*.00015;

        if(
            pos[i*3+1]>3.9
        ){

            pos[i*3+1]=0;
        }
    }

    dust.geometry.attributes
        .position.needsUpdate=true;


    /* random events */

    if(started){

        eventCooldown-=.016;

        if(
            eventCooldown<=0
        ){

            horrorEvent();

            eventCooldown=
                5+
                Math.random()*10;
        }
    }


    /* movement */

    if(started){

        let forward=0;
        let strafe=0;


        forward+=-joyY;
        strafe+=joyX;


        if(keys["w"])
            forward+=1;

        if(keys["s"])
            forward-=1;

        if(keys["a"])
            strafe-=1;

        if(keys["d"])
            strafe+=1;


        const len=
            Math.hypot(
                forward,
                strafe
            );


        if(len>1){

            forward/=len;
            strafe/=len;
        }


        if(
            forward!==0 ||
            strafe!==0
        ){

            movePlayer(
                forward,
                strafe
            );
        }
    }


    /* camera */

    camera.rotation.order=
        "YXZ";

    camera.rotation.y=
        yaw;

    camera.rotation.x=
        pitch;


    /*
       Flashlight follows exact
       camera direction.
    */

    flashlight.position.set(
        camera.position.x,
        camera.position.y-.03,
        camera.position.z
    );


    const direction=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    direction.applyQuaternion(
        camera.quaternion
    );


    flashlight.target.position.copy(
        camera.position
    ).add(
        direction.multiplyScalar(20)
    );


    /*
       Door animation.
    */

    for(
        const d of doors
    ){

        const target=
            d.open
            ? -Math.PI/2
            : 0;

        d.angle+=
            (
                target-
                d.angle
            )*.13;

        d.pivot.rotation.y=
            d.rotation+
            d.angle;
    }


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
